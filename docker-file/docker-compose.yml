# 构建加速：请使用 BuildKit 以启用 Maven/npm 缓存（首次构建后依赖层会被缓存）
#   export DOCKER_BUILDKIT=1
#   docker compose -f docker-file/docker-compose.yml build
#
# Docker Hub 基础镜像（maven、eclipse-temurin、node、nginx、mysql）拉取加速：
#   在 /etc/docker/daemon.json 添加 "registry-mirrors": ["https://registry.cn-hangzhou.aliyuncs.com"]
#   或登录阿里云容器镜像服务控制台获取个人专属加速地址，然后 systemctl restart docker
#
# 仅重建并启动后端/前端（保留 MySQL/Postgres 数据，model_config 等不会丢）：
#   docker compose -f docker-file/docker-compose.yml up -d --build backend frontend
# 注意：不要使用 docker compose down -v，-v 会删除数据卷，导致库表数据被清空。

services:
  # MySQL数据库（业务库，挂载 volume 后 down/up 不会丢数据）
  mysql:
    image: mysql:8.0
    container_name: data-agent-mysql-inner
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nl2sql_db
    volumes:
      - data-agent-mysql-inner-data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # 后端服务
  backend:
    build:
      context: ..
      dockerfile: ./docker-file/Dockerfile-backend
      tags:
        - saa-data-agent-backend:1.0.0-SNAPSHOT
    container_name: data-agent-backend
    environment:
      - DATA_AGENT_DATASOURCE_URL=jdbc:mysql://mysql:3306/nl2sql_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DATA_AGENT_DATASOURCE_USERNAME=root
      - DATA_AGENT_DATASOURCE_PASSWORD=root
      # always：启动时执行 schema.sql/data.sql 建表及示例数据（schema 用 IF NOT EXISTS，data 用 INSERT IGNORE，可重复执行）
      - DATA_AGENT_DATASOURCE_SQL_INIT=always
      - AI_DASHSCOPE_API_KEY=sk-457106eabde94d1db30aa805d18a315a
    ports:
      - "8065:8065"
    depends_on:
      mysql:
        condition: service_healthy
      # 模拟数据源仅需容器已启动即可，init 脚本在后台跑完会自行变 healthy，避免 compose up 等太久
      mysql-data:
        condition: service_healthy
      postgres-data:
        condition: service_healthy
    networks:
      - app-network
    restart: no

  # Vue前端服务
  frontend:
    build:
      context: ..
      dockerfile: ./docker-file/Dockerfile-frontend
      tags:
        - saa-data-agent-frontend:1.0.0-SNAPSHOT
    container_name: data-agent-frontend
    ports:
      - "3000:3000"  # 只暴露前端端口
    depends_on:
      - backend
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - app-network
    restart: unless-stopped

  # MySQL 模拟数据源（挂载 volume 后 down/up 不会丢数据，仅首次执行 product_db.sql）
  mysql-data:
    image: mysql:8.0
    container_name: data-agent-mysql-datasource
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    networks:
      - app-network
    volumes:
      - data-agent-mysql-datasource-data:/var/lib/mysql
      - ./config/mysql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 120s

  # PostgreSQL 模拟数据源（挂载 volume 后 down/up 不会丢数据）
  # 使用 postgres:15 匹配既有数据目录；官方镜像多架构（arm64/amd64）
  postgres-data:
    image: postgres:15
    container_name: data-agent-postgres-datasource
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - app-network
    volumes:
      - data-agent-postgres-datasource-data:/var/lib/postgresql/data
      - ./config/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  data-agent-mysql-inner-data:
  data-agent-mysql-datasource-data:
  data-agent-postgres-datasource-data:

networks:
  app-network:
    driver: bridge
    name: "data-agent-network"
